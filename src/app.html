<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f4efe7" />
		<meta name="description" content="Chica Maria — moda feminina em Passo Fundo, RS. Vestidos, alfaiataria, tricôs e acessórios." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			(function () {
				var d = document.documentElement;
				d.classList.add('js');
				try {
					var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
					if (!calm && !sessionStorage.getItem('cm:intro')) {
						d.classList.add('has-intro');
						sessionStorage.setItem('cm:intro', '1');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
